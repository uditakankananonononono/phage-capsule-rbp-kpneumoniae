name: Bounded ESM-2 CPU timing pilot (private)
on:
  workflow_dispatch:
concurrency:
  group: phage-esm-cpu-timing-pilot
  cancel-in-progress: true
jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU tools
        run: |
          python -m pip install --disable-pip-version-check 'torch==2.3.1' 'fair-esm==2.0.0' 'pandas==2.2.2' 'numpy==1.26.4'
      - name: Run bounded reference-only pilot
        env:
          OMP_NUM_THREADS: '4'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '4'
        run: python code/esm_cpu_timing_pilot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: esm-cpu-timing-checkpoint
          path: timing-results/checkpoint.json
          if-no-files-found: warn
          retention-days: 1
